name: CI

on:
  push:
    branches:
      - "**"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # staticcheck is pinned, and built with the Go it needs: @latest moves to newer Go
      # releases (v0.8.2 needs go 1.26) and broke this job. It still checks the code against
      # the go version in go.mod; the build and test jobs cover the old toolchains.
      - name: Setup go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: lint
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.2 &&
          $HOME/go/bin/staticcheck &&
          make vet
      - name: Root module stays dependency-free
        # The module list, not `go list -deps`: the latter includes the standard library's
        # own vendored golang.org/x packages and is never empty.
        run: |
          go list -m all
          [ "$(go list -m all | wc -l)" -eq 1 ]

  # ginviva is its own module (it requires gin, which needs go 1.20+), so the root jobs above
  # never build it: `./...` does not descend into a directory with its own go.mod.
  ginviva:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ["1.26", "1.25", "1.24", "1.23", "1.22", "1.21", "1.20"]
    name: "ginviva: go v${{ matrix.go }}"
    defaults:
      run:
        working-directory: ginviva
    steps:
      - uses: actions/checkout@v4
      - name: Setup go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...

  build:
     runs-on: ubuntu-latest
     strategy:
       matrix:
         go: ["1.26", "1.25", "1.24", "1.23", "1.22", "1.21", "1.20", "1.19", "1.18", "1.17"]
     name: "Build: go v${{ matrix.go }}"
     steps:
       - uses: actions/checkout@v4
       - name: Setup go
         uses: actions/setup-go@v5
         with:
           go-version: ${{ matrix.go }}
       - name: Build
         run: |
           go build ./... &&
           make build-example

  test:
     runs-on: ubuntu-latest
     strategy:
       matrix:
         go: ["1.26", "1.25", "1.24", "1.23", "1.22", "1.21", "1.20", "1.19", "1.18", "1.17"]
     name: "Test: go v${{ matrix.go }}"
     steps:
       - uses: actions/checkout@v4
       - name: Setup go
         uses: actions/setup-go@v5
         with:
           go-version: ${{ matrix.go }}
       - name: Test
         run: make test
