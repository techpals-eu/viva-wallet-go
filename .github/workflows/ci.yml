name: CI

on:
  push:
    branches:
      - "**"

jobs:
  # Each staticcheck release needs a minimum Go to build (v0.8.x needs 1.26), so every Go
  # version gets the newest release it can build, pinned. Never use @latest: a new release
  # raises the floor and breaks the older rows.
  lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { go: "1.26", staticcheck: v0.8.2 }
          - { go: "1.25", staticcheck: v0.7.0 }
          - { go: "1.24", staticcheck: v0.6.1 }
          - { go: "1.23", staticcheck: v0.6.1 }
          - { go: "1.22", staticcheck: v0.5.1 }
          - { go: "1.21", staticcheck: v0.4.7 }
          - { go: "1.20", staticcheck: v0.4.7 }
          - { go: "1.19", staticcheck: v0.4.7 }
          - { go: "1.18", staticcheck: v0.3.3 }
          - { go: "1.17", staticcheck: v0.3.3 }
    name: "Lint: go v${{ matrix.go }}"
    steps:
      - uses: actions/checkout@v4
      - name: Setup go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - name: staticcheck ${{ matrix.staticcheck }}
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@${{ matrix.staticcheck }}
          "$(go env GOPATH)/bin/staticcheck" ./...
      - name: vet
        run: make vet
      - name: Root module stays dependency-free
        if: matrix.go == '1.26'
        # The module list, not `go list -deps`: the latter includes the standard library's
        # own vendored golang.org/x packages and is never empty.
        run: |
          go list -m all
          [ "$(go list -m all | wc -l)" -eq 1 ]

  # ginviva is its own module (it requires gin, which needs go 1.20+), so the root jobs above
  # never build it: `./...` does not descend into a directory with its own go.mod.
  ginviva:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ["1.26", "1.25", "1.24", "1.23", "1.22", "1.21", "1.20"]
    name: "ginviva: go v${{ matrix.go }}"
    defaults:
      run:
        working-directory: ginviva
    steps:
      - uses: actions/checkout@v4
      - name: Setup go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...

  build:
     runs-on: ubuntu-latest
     strategy:
       matrix:
         go: ["1.26", "1.25", "1.24", "1.23", "1.22", "1.21", "1.20", "1.19", "1.18", "1.17"]
     name: "Build: go v${{ matrix.go }}"
     steps:
       - uses: actions/checkout@v4
       - name: Setup go
         uses: actions/setup-go@v5
         with:
           go-version: ${{ matrix.go }}
       - name: Build
         run: |
           go build ./... &&
           make build-example

  test:
     runs-on: ubuntu-latest
     strategy:
       matrix:
         go: ["1.26", "1.25", "1.24", "1.23", "1.22", "1.21", "1.20", "1.19", "1.18", "1.17"]
     name: "Test: go v${{ matrix.go }}"
     steps:
       - uses: actions/checkout@v4
       - name: Setup go
         uses: actions/setup-go@v5
         with:
           go-version: ${{ matrix.go }}
       - name: Test
         run: make test
